baseURL = "https://Rock-superdev.github.io/book/"
languageCode = "zh-cn"
title = "My Book Blog"
# Theme loaded via [module] below; do NOT also set `theme = "ananke"` here.

# 文章默认结构
[params]
  mainSections = ["posts"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# permalink: /posts/:slug/
[permalinks]
  posts = "/:slug/"

# Hugo module: load Ananke theme via Go modules
[module]
  [[module.imports]]
    path = "github.com/gohugo-ananke/ananke/v2"